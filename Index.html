<!DOCTYPE html>
<html>
<head>
    <title>Probotics NRL 134</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
            color: black;
            text-align: center;
        }

        .welcome {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .welcome img {
            width: 250px;
            animation: logo 2s ease-in-out;
        }

        h1 {
            color: #0066ff;
            font-size: 32px;
            margin: 20px 0 10px;
        }

        h2 {
            font-size: 18px;
            letter-spacing: 2px;
        }

        p {
            font-size: 16px;
        }

        @keyframes logo {
            from {
                opacity: 0;
                transform: scale(0.5);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <section class="welcome">

        <img src="IMG-20260909-WA0000.jpg" alt="Probotics Logo">

        <h1>WELCOME TO THE OFFICIAL WEBSITE OF PROBOTICS</h1>

        <h2>BUILD TO INNOVATE, DRIVEN TO WIN.</h2>

        <p>National Robotics League — NRL 134</p>

    </section>

</body>
</html>
